<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elite Gold AI</title>
<style>
body {
  margin: 0;
  padding: 20px;
  background: #10141d;
  color: white;
  font-family: Arial, sans-serif;
}
.card {
  background: #1b2230;
  padding: 20px;
  border-radius: 16px;
  margin-bottom: 16px;
}
h1 { color: #f0bd4f; }
button {
  padding: 14px;
  border: 0;
  border-radius: 10px;
  color: white;
  font-weight: bold;
  width: 48%;
}
#start { background: #16834b; }
#stop { background: #b83232; }
select, input {
  padding: 12px;
  width: 100%;
  margin: 8px 0;
  border-radius: 8px;
  box-sizing: border-box;
}
.note { color: #ffce70; }
</style>
</head>
<body>
<h1>🥇 ELITE GOLD AI</h1>
<p>Personal Trading Dashboard</p>
<div class="card">
  <h2>XAUUSD · Gold</h2>
  <p>Strategy: M15 Trend + M5 Entry</p>
  <label>Risk per trade (%)</label>
  <input type="number" id="risk" value="0.5" min="0.1" max="0.5" step="0.1">
  <label>Trading mode</label>
  <select id="mode">
    <option>DEMO</option>
    <option>REAL - DISABLED</option>
  </select>
</div>
<div class="card">
  <button id="start" onclick="startBot()">START</button>
  <button id="stop" onclick="stopBot()">STOP</button>
  <h3 id="status">Status: STOPPED</h3>
  <p class="note" id="message">Demo dashboard only — no trades are being placed.</p>
</div>
<script>
function startBot() {
  document.getElementById("status").textContent =
    "Status: SIMULATION ON";
  document.getElementById("message").textContent =
    "Simulation only. MT5 is not connected.";
}
function stopBot() {
  document.getElementById("status").textContent =
    "Status: STOPPED";
  document.getElementById("message").textContent =
    "Simulation stopped. No trades were placed.";
}
</script>
</body>
</html>
